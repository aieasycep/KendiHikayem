name: Android APK

# APK'yi YALNIZCA elle tetikleyin: Actions sekmesi > "Android APK" > "Run workflow".
# Cikti: Actions calismasinin altindaki "Artifacts" bolumu (kendihikayem-debug-apk).
#
# Neden push tetikleyicisi yok: APK derlemesi ~10 dakika suruyor. Sik push ettigimizde
# asagidaki concurrency kurali devredeki derlemeyi iptal ediyor ve hicbir calisma
# tamamlanamiyordu. Hizli geri bildirim zaten ci.yml'de (typecheck/lint/test, her push'ta).
on:
  workflow_dispatch:
    inputs:
      # ⭐ APK'nin hangi backend'e bakacagi DERLEME aninda belirlenir: Expo
      # EXPO_PUBLIC_* degiskenlerini JS paketine gomer (apps/mobile/app.config.ts).
      # Calisan uygulamada degistirilebilen bir ayar DEGILDIR -- adres degisirse yeni
      # bir APK gerekir. Bu yuzden iki girdi burada duruyor: mock APK ile canli APK
      # arasindaki tek fark bunlar (docs/DEPLOY.md 4. adim).
      api_mode:
        description: 'API kipi: mock (demo veri, backend gerekmez) | live (gercek API)'
        type: choice
        options: ['mock', 'live']
        default: 'mock'
      api_base_url:
        description: 'live icin API adresi, orn. https://kendihikayem-api.onrender.com'
        type: string
        required: false
        default: ''

concurrency:
  group: android-${{ github.ref }}
  # Elle tetiklendigi icin ayni anda birden fazla calisma nadir; yine de yeni bir istek
  # eskisini iptal etmesin -- baslatilan her derleme sonuna kadar gitsin.
  cancel-in-progress: false

# Release olusturmak icin gerekli; varsayilan token salt okunurdur.
permissions:
  contents: write

jobs:
  apk:
    name: APK derle (debug, JS paketi gomulu)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # Varsayilan mock: uygulama tamamen demo veriyle calisir, hicbir AI saglayicisina
      # veya backend'e ihtiyac duymaz, telefonda internet olmadan da acilir.
      # live secilirse istekler asagidaki adrese gider.
      API_MODE: ${{ inputs.api_mode || 'mock' }}
      EXPO_PUBLIC_API_MODE: ${{ inputs.api_mode || 'mock' }}
      EXPO_PUBLIC_API_BASE_URL: ${{ inputs.api_base_url }}
      # Expo hesabina baglanmayi engeller; prebuild tamamen yerel calisir.
      EXPO_NO_TELEMETRY: '1'
      CI: '1'
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false

    steps:
      - name: 0) live secildiyse API adresi zorunlu
        # Adressiz bir live APK, apps/mobile/lib/api.ts'teki varsayilana (10.0.2.2 =
        # Android emulatorunun ana makinesi) duser ve gercek bir telefonda hicbir istek
        # tamamlanmaz. Bunu burada durdurmak, 10 dakikalik bir derlemeden sonra ise
        # yaramayan bir APK dagitmaktan ucuz.
        if: ${{ inputs.api_mode == 'live' && inputs.api_base_url == '' }}
        run: |
          echo "::error::api_mode=live secildi ama api_base_url bos. Render adresini girin."
          exit 1

      - name: 1) Depoyu indir
        uses: actions/checkout@v4

      - name: 2) pnpm 10.33.0 kur
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: 3) Node 22 kur (pnpm store cache ile)
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm

      - name: 4) JDK 17 (Temurin) kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 5) Android SDK'yi hazirla
        uses: android-actions/setup-android@v3

      - name: 6) Bagimliliklari kur (kilitli surumlerle)
        run: pnpm install --frozen-lockfile

      - name: 7) Turkce yardimcilarin testleri
        run: pnpm --filter @kendihikayem/shared test

      - name: 8) Tip kontrolu
        run: pnpm -w typecheck

      - name: 9) Android projesini uret (expo prebuild)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: 10) Gradle onbellegi
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 11) APK derle (assembleDebug, JS paketi gomulu)
        # NEDEN debug (ama JS paketi gomulu):
        #
        # Varsayilan debug APK, JS paketini icine GOMMEZ -- calisma aninda Metro
        # sunucusundan (localhost:8081) indirmeye calisir. Test edenin telefonunda
        # Metro olmadigi icin paket hic yuklenmiyor, React hic mount olmuyor ve
        # uygulama splash ekraninda sonsuza kadar takili kaliyordu.
        # Cozum: apps/mobile/plugins/withBundleInDebug.js paketi APK'ya gomduruyor.
        #
        # Release derlemesi de paketi gomer ve debug keystore ile imzalanir, ama
        # bir JS hatasi olustugunda sureci sessizce oldurur ("uygulama surekli
        # olarak duruyor") -- elimizde teshis edecek hicbir sey kalmaz. Debug
        # derlemesi ayni hatayi EKRANDA, yigin izisiyle gosterir. Uygulama kararli
        # sekilde acilana kadar teshis edilebilirlik boyuttan daha degerli.
        #
        # reactNativeArchitectures: yalnizca gercek telefonlarin mimarileri derlenir
        # (arm64-v8a = 2017 sonrasi her telefon, armeabi-v7a = eski 32-bit cihazlar).
        # x86/x86_64 (emulator) atlanir; derleme suresini yaklasik yariya indirir.
        # Emulatorde test etmek isterseniz listeye x86_64 ekleyin.
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: 12) APK'yi dogrula
        run: |
          set -euo pipefail
          APK="apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::APK bulunamadi: $APK"
            exit 1
          fi
          echo "APK boyutu: $(du -h "$APK" | cut -f1)"

      - name: 13) APK'yi yukle (Artifacts bolumunde gorunur)
        uses: actions/upload-artifact@v4
        with:
          name: kendihikayem-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      # Artifact indirmek GitHub'a giris yapmayi gerektiriyor ve ZIP olarak geliyor --
      # telefonda kurmak icin zahmetli. Release varligi ise girissiz, dogrudan
      # indirilebilir ve linki sabit kalir: her derleme ayni etiketin uzerine yazar.
      - name: 14) APK'yi Release olarak yayinla (telefondan dogrudan indirilir)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK" kendihikayem.apk

          TAG="apk-son"
          NOT="KendiHikayem test surumu (debug imzali).

          Commit: ${{ github.sha }}
          Derleme: ${{ github.run_number }} - $(date -u '+%d.%m.%Y %H:%M UTC')

          KURULUM
          1. Asagidaki kendihikayem.apk dosyasina telefonunuzun tarayicisindan dokunun.
          2. 'Bilinmeyen kaynaklardan kuruluma izin ver' cikarsa onaylayin.
          3. Uygulama tamamen demo veriyle calisir; internet gerekmez.

          NOT: Gercek telefon icin derlenmistir (arm64-v8a, armeabi-v7a).
          Emulatorde kurulmaz."

          # Etiketi ve release'i her seferinde tazele ki link hep son APK'yi versin.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" kendihikayem.apk \
            --title "KendiHikayem - son test APK'si" \
            --notes "$NOT" \
            --prerelease \
            --target "${{ github.sha }}"

          echo "Indirme linki: https://github.com/${{ github.repository }}/releases/download/$TAG/kendihikayem.apk"

      - name: 15) Hata durumunda Gradle raporlarini yukle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-hata-raporlari
          path: |
            apps/mobile/android/app/build/reports/**
            apps/mobile/android/build/reports/**
          retention-days: 7
          if-no-files-found: ignore
