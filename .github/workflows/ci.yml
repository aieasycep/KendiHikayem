name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tip kontrolu, lint ve testler
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      API_MODE: mock
      CI: '1'
      # apps/api and packages/db integration tests run against a real database on
      # purpose: the cost-reservation lock and the CHECK constraints are the whole
      # point, and neither one can be exercised against a mock. The URL matches
      # .env.example and infra/docker/compose.yml byte for byte.
      DATABASE_URL: postgresql://kendihikayem:kendihikayem@localhost:5432/kendihikayem

    # A service container gives those tests a real PostgreSQL 16. Without it the
    # suite fails on ECONNREFUSED, which is what turned CI red.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kendihikayem
          POSTGRES_PASSWORD: kendihikayem
          POSTGRES_DB: kendihikayem
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kendihikayem"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: 1) Depoyu indir
        uses: actions/checkout@v4

      - name: 2) pnpm 10.33.0 kur
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: 3) Node 22 kur (pnpm store cache ile)
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm

      - name: 4) Bagimliliklari kur (kilitli surumlerle)
        run: pnpm install --frozen-lockfile

      - name: 5) Tip kontrolu
        run: pnpm -w typecheck

      - name: 6) Lint (mimari sinir kurallari dahil)
        run: pnpm -w lint

      - name: 7) Veritabani semasini kur (migration'lar)
        run: pnpm --filter @kendihikayem/db db:migrate

      - name: 8) Testler
        # --concurrency=2: bazi paketler CPU-yogun (goruntu QA piksel analizi,
        # ses DSP olcumleri, PDF rasterlemesi). Turbo'nun varsayilan paralelligiyle
        # 4 cekirdekli runner'da bunlar birbirinin CPU'sunu aliyor ve 5 sn'lik
        # vitest zaman asimina takiliyorlar — testin kendisi degil, sirasi
        # kirmiziya dusuruyor. Sinirli paralellik hem hizli hem kararli.
        run: npx turbo run test --concurrency=2
