info:
  title: "KendiHikayem Ops API"
  version: "0.1.0"
  description: "Ic operasyon paneli (O01-O05). Admin yetkisi ister; kullanici uygulamasi bu uclari GORMEZ."
servers:
  - url: "https://api.kendihikayem.com"
    description: uretim
  - url: "http://localhost:3001"
    description: "yerel gelistirme"
components:
  schemas:
    ApiError:
      type: object
      properties:
        code:
          type: string
          enum:
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - VALIDATION_FAILED
            - IDEMPOTENCY_KEY_REUSED
            - IDEMPOTENCY_CONFLICT
            - CLIENT_UPDATE_REQUIRED
            - RATE_LIMITED
            - PROVIDER_UNAVAILABLE
            - INTERNAL
            - QUOTA_EXCEEDED
            - COST_CAP_REACHED
            - INSUFFICIENT_CREDITS
            - PLAN_UPGRADE_REQUIRED
            - CONSENT_REQUIRED
            - CONSENT_REVOKED
            - PHONE_VERIFICATION_REQUIRED
            - VOICE_QUALITY_LOW
            - VOICE_SCRIPT_MISMATCH
            - VOICE_LIMIT_REACHED
            - VOICE_SLOT_EXHAUSTED
            - INVALID_NAME
            - INJECTION_DETECTED
            - CONTENT_BLOCKED
            - MODERATION_BLOCKED
            - AGE_POLICY_VIOLATION
            - STORY_NOT_APPROVED
            - JOB_NOT_CANCELLABLE
            - COK_KISA
            - COK_UZUN
            - GURULTULU
            - KLIPLENME
            - COK_SESSIZ
            - YANKILI
            - COK_HIZLI
            - COK_YAVAS
            - METIN_ESLESMEDI
            - BIRDEN_FAZLA_KONUSMACI
            - DAR_BANT_GENISLIGI
        messageTr:
          type: string
          minLength: 1
        detail:
          type: string
        field:
          type: string
        retryable:
          type: boolean
        retryAfterSec:
          type: integer
          minimum: 0
        traceId:
          type: string
          minLength: 1
        issues:
          type: array
          items:
            type: string
            enum:
              - COK_KISA
              - COK_UZUN
              - GURULTULU
              - KLIPLENME
              - COK_SESSIZ
              - YANKILI
              - COK_HIZLI
              - COK_YAVAS
              - METIN_ESLESMEDI
              - BIRDEN_FAZLA_KONUSMACI
              - DAR_BANT_GENISLIGI
      required:
        - code
        - messageTr
        - retryable
        - traceId
    SignedMedia:
      type: object
      properties:
        url:
          type: string
          format: uri
        mimeType:
          type: string
          minLength: 1
        expiresAt:
          type: string
          format: date-time
        sizeBytes:
          type: integer
          minimum: 0
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        durationMs:
          type: integer
          minimum: 0
      required:
        - url
        - mimeType
        - expiresAt
