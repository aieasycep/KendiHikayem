# Yerel gelistirme altyapisi.
#
#   pnpm infra:up     → ayaga kaldirir
#   pnpm infra:down   → durdurur
#
# Uretimde ayni imajlar Hetzner CCX uzerinde Coolify ile calisir (SPEC §2).
# Bu dosya UYGULAMAYI calistirmaz; yalnizca bagimliliklarini (PG, Valkey, S3) verir.

name: kendihikayem

services:
  # ── PostgreSQL 16 — durum kaynagi (SPEC §2, §4) ───────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: kh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kendihikayem
      POSTGRES_PASSWORD: kendihikayem
      POSTGRES_DB: kendihikayem
      # Turkce siralama ve buyuk/kucuk harf davranisi icin: veri tabani seviyesinde
      # tr_TR yerine C.UTF-8 kullanip siralamayi uygulama katmaninda yapiyoruz —
      # boylece Alpine/Debian imaj degisikligi siralamayi degistirmez.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C.UTF-8'
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kendihikayem -d kendihikayem']
      interval: 5s
      timeout: 5s
      retries: 20

  # ── Valkey 8 (Redis uyumlu) — BullMQ kuyrugu (SPEC §2) ────────────────────
  valkey:
    image: valkey/valkey:8-alpine
    container_name: kh-valkey
    restart: unless-stopped
    # BullMQ, Redis'in anahtarlari kendiliginden dusurmesini kaldiramaz:
    # noeviction disinda bir politika is kaybina yol acar.
    command: ['valkey-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '6379:6379'
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  # ── MinIO — S3 uyumlu nesne depolama ──────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: kh-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: kendihikayem
      MINIO_ROOT_PASSWORD: kendihikayem
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Web konsolu → http://localhost:9001
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # ── Bucket'lari bir kez olusturur, sonra kapanir ──────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: kh-minio-init
    depends_on:
      minio:
        condition: service_healthy
    # ⚠️ KVKK: ham ses kayitlari AYRI bucket'ta durur (SPEC §2, §10).
    # Uretimde bu bucket ayri bir CMK ile sifrelenir ve +30 gun lifecycle kurali ile imha edilir.
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 kendihikayem kendihikayem &&
      mc mb --ignore-existing local/kh-media &&
      mc mb --ignore-existing local/kh-voice-raw &&
      mc version enable local/kh-voice-raw &&
      echo 'Bucket hazir: kh-media, kh-voice-raw'
      "
    restart: 'no'

volumes:
  postgres-data:
  valkey-data:
  minio-data:
